<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaPro - Demostración de Sistema de Citas</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981',
                        dark: '#1e293b',
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .gradient-text { background: linear-gradient(135deg, #4f46e5, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Datos simulados (Mock Data)
        const SERVICES = [
            { id: 'medico', name: 'Consultorio Médico', icon: 'fa-user-doctor', img: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=400' },
            { id: 'spa', name: 'Spa & Relajación', icon: 'fa-spa', img: 'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&q=80&w=400' },
            { id: 'belleza', name: 'Salón de Belleza', icon: 'fa-scissors', img: 'https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&q=80&w=400' },
            { id: 'abogados', name: 'Despacho Legal', icon: 'fa-scale-balanced', img: 'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&q=80&w=400' },
            { id: 'taller', name: 'Taller Automotriz', icon: 'fa-car', img: 'https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&q=80&w=400' },
            { id: 'psicologia', name: 'Terapia Psicológica', icon: 'fa-brain', img: 'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&q=80&w=400' }
        ];

        const TIME_SLOTS = ['09:00 AM', '10:00 AM', '11:30 AM', '01:00 PM', '03:30 PM', '05:00 PM'];

        const Navbar = () => (
            <nav className="fixed w-full z-50 glass-effect transition-all duration-300">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center h-16">
                        <div className="flex items-center gap-2">
                            <div className="bg-primary text-white p-2 rounded-lg">
                                <i className="fa-solid fa-calendar-check text-xl"></i>
                            </div>
                            <span className="font-bold text-xl text-dark tracking-tight">Reserva<span className="text-primary">Pro</span></span>
                        </div>
                        <div className="hidden md:flex space-x-8">
                            <a href="#inicio" className="text-gray-600 hover:text-primary transition-colors font-medium">Inicio</a>
                            <a href="#industrias" className="text-gray-600 hover:text-primary transition-colors font-medium">Soluciones</a>
                            <a href="#demo" className="text-gray-600 hover:text-primary transition-colors font-medium">Probar Demo</a>
                        </div>
                        <a href="#contacto-final" className="bg-dark hover:bg-gray-800 text-white px-5 py-2 rounded-full font-medium transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                            Tu propia Web
                        </a>
                    </div>
                </div>
            </nav>
        );

        const Hero = () => (
            <section id="inicio" className="pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto flex flex-col lg:flex-row items-center gap-12">
                <div className="lg:w-1/2 space-y-8 animate-fade-in-up">
                    <div className="inline-block bg-indigo-100 text-primary px-4 py-1.5 rounded-full text-sm font-bold tracking-wide">
                        🚀 SISTEMA DE RESERVAS INTELIGENTE
                    </div>
                    <h1 className="text-5xl lg:text-6xl font-extrabold text-dark leading-tight">
                        Automatiza tus citas y <span className="gradient-text">multiplica tus clientes</span>
                    </h1>
                    <p className="text-lg text-gray-600 leading-relaxed max-w-xl">
                        Olvídate del papel y lápiz o los interminables mensajes para agendar. Ofrece a tus clientes una experiencia moderna, 24/7 y sin complicaciones.
                    </p>
                    <div className="flex flex-col sm:flex-row gap-4">
                        <a href="#demo" className="bg-primary hover:bg-indigo-700 text-white px-8 py-4 rounded-full font-bold text-lg transition-all shadow-lg hover:shadow-indigo-500/30 flex items-center justify-center gap-2">
                            Probar Demo Ahora <i className="fa-solid fa-arrow-right"></i>
                        </a>
                        <div className="flex items-center gap-4 text-sm text-gray-500 font-medium">
                            <div className="flex -space-x-2">
                                <img className="w-8 h-8 rounded-full border-2 border-white" src="https://i.pravatar.cc/100?img=1" alt="User"/>
                                <img className="w-8 h-8 rounded-full border-2 border-white" src="https://i.pravatar.cc/100?img=2" alt="User"/>
                                <img className="w-8 h-8 rounded-full border-2 border-white" src="https://i.pravatar.cc/100?img=3" alt="User"/>
                            </div>
                            <span>+500 negocios lo usan</span>
                        </div>
                    </div>
                </div>
                <div className="lg:w-1/2 relative animate-float">
                    <div className="absolute inset-0 bg-gradient-to-r from-primary to-pink-500 blur-3xl opacity-20 rounded-full"></div>
                    <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=800" 
                         alt="Dashboard Dashboard" 
                         className="relative z-10 rounded-2xl shadow-2xl border border-gray-100 transform rotate-2 hover:rotate-0 transition-transform duration-500" />
                    
                    {/* Floating Widget Mock */}
                    <div className="absolute -bottom-6 -left-6 bg-white p-4 rounded-xl shadow-xl z-20 flex items-center gap-4 animate-bounce" style={{animationDuration: '3s'}}>
                        <div className="bg-green-100 text-green-600 p-3 rounded-full">
                            <i className="fa-solid fa-check"></i>
                        </div>
                        <div>
                            <p className="font-bold text-sm text-dark">Nueva cita agendada</p>
                            <p className="text-xs text-gray-500">Hace 2 minutos</p>
                        </div>
                    </div>
                </div>
            </section>
        );

        const IndustryGrid = () => (
            <section id="industrias" className="py-20 bg-white">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="text-center mb-16 animate-fade-in-up">
                        <h2 className="text-3xl font-bold text-dark mb-4">Adaptable a cualquier tipo de negocio</h2>
                        <p className="text-gray-600 max-w-2xl mx-auto">Nuestro sistema se configura a la medida de tus necesidades, sin importar la industria en la que te encuentres.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {SERVICES.map((service, index) => (
                            <div key={index} className="group relative overflow-hidden rounded-2xl shadow-sm hover:shadow-2xl transition-all duration-300 border border-gray-100 cursor-pointer bg-white">
                                <div className="h-48 overflow-hidden">
                                    <img src={service.img} alt={service.name} className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-80"></div>
                                </div>
                                <div className="absolute bottom-0 w-full p-6 text-white transform translate-y-2 group-hover:translate-y-0 transition-transform">
                                    <div className="w-12 h-12 bg-primary rounded-xl flex items-center justify-center mb-4 shadow-lg group-hover:bg-white group-hover:text-primary transition-colors">
                                        <i className={`fa-solid ${service.icon} text-xl`}></i>
                                    </div>
                                    <h3 className="text-xl font-bold mb-1">{service.name}</h3>
                                    <p className="text-sm text-gray-200 opacity-0 group-hover:opacity-100 transition-opacity delay-100">Solución digital personalizada</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const BookingDemo = () => {
            const [step, setStep] = useState(1);
            const [selectedService, setSelectedService] = useState(null);
            const [selectedDate, setSelectedDate] = useState('');
            const [selectedTime, setSelectedTime] = useState('');
            const [customerName, setCustomerName] = useState('');

            // Generar fechas próximas simuladas
            const today = new Date();
            const dates = Array.from({length: 5}, (_, i) => {
                const d = new Date(today);
                d.setDate(today.getDate() + i + 1);
                return d;
            });

            const handleWhatsAppRedirect = (e) => {
                e.preventDefault();
                if(!selectedService || !selectedDate || !selectedTime || !customerName) return;
                
                const serviceName = SERVICES.find(s => s.id === selectedService)?.name || 'Servicio General';
                
                // Mensaje solicitado por el usuario
                const mensaje = `Hola, soy ${customerName}. Acabo de probar la demostración de reservas en su página web.\n\nSimulé una cita para: *${serviceName}* el día *${selectedDate}* a las *${selectedTime}*.\n\nMe pareció excelente y quisiera más información sobre sus servicios para crear una solución digital (Página web/App) para mi negocio.`;
                
                const whatsappUrl = `https://wa.me/527777926013?text=${encodeURIComponent(mensaje)}`;
                window.open(whatsappUrl, '_blank');
            };

            return (
                <section id="demo" className="py-24 bg-gray-50">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-extrabold text-dark mb-4">Prueba el sistema ahora mismo</h2>
                            <p className="text-gray-600">Simula cómo tus clientes agendarían una cita contigo.</p>
                        </div>

                        <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                            <div className="flex border-b border-gray-100 bg-gray-50">
                                <div className={`flex-1 text-center py-4 font-semibold text-sm transition-colors ${step >= 1 ? 'text-primary border-b-2 border-primary' : 'text-gray-400'}`}>1. Servicio</div>
                                <div className={`flex-1 text-center py-4 font-semibold text-sm transition-colors ${step >= 2 ? 'text-primary border-b-2 border-primary' : 'text-gray-400'}`}>2. Fecha y Hora</div>
                                <div className={`flex-1 text-center py-4 font-semibold text-sm transition-colors ${step >= 3 ? 'text-primary border-b-2 border-primary' : 'text-gray-400'}`}>3. Confirmación</div>
                            </div>

                            <div className="p-8">
                                {/* Paso 1 */}
                                {step === 1 && (
                                    <div className="animate-fade-in-up">
                                        <h3 className="text-xl font-bold mb-6 text-dark">¿Qué servicio te interesa simular?</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                            {SERVICES.map(s => (
                                                <button 
                                                    key={s.id}
                                                    onClick={() => setSelectedService(s.id)}
                                                    className={`p-4 rounded-xl border-2 transition-all text-left flex flex-col items-center justify-center gap-3 hover:border-primary ${selectedService === s.id ? 'border-primary bg-indigo-50 text-primary' : 'border-gray-100 text-gray-600'}`}
                                                >
                                                    <i className={`fa-solid ${s.icon} text-2xl`}></i>
                                                    <span className="font-medium text-sm text-center">{s.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <div className="mt-8 flex justify-end">
                                            <button 
                                                disabled={!selectedService}
                                                onClick={() => setStep(2)}
                                                className="bg-dark disabled:bg-gray-300 disabled:cursor-not-allowed text-white px-8 py-3 rounded-xl font-bold transition-all hover:bg-gray-800"
                                            >
                                                Continuar <i className="fa-solid fa-arrow-right ml-2"></i>
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Paso 2 */}
                                {step === 2 && (
                                    <div className="animate-fade-in-up">
                                        <h3 className="text-xl font-bold mb-6 text-dark">Selecciona un día y horario</h3>
                                        
                                        <div className="mb-6">
                                            <p className="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Próximos días</p>
                                            <div className="flex gap-3 overflow-x-auto pb-4 hide-scrollbar">
                                                {dates.map((d, i) => {
                                                    const dateStr = d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
                                                    return (
                                                        <button 
                                                            key={i}
                                                            onClick={() => setSelectedDate(dateStr)}
                                                            className={`flex-shrink-0 p-4 rounded-xl border-2 min-w-[100px] text-center transition-all ${selectedDate === dateStr ? 'border-primary bg-indigo-50 text-primary' : 'border-gray-100 hover:border-primary'}`}
                                                        >
                                                            <span className="block text-xs uppercase mb-1">{d.toLocaleDateString('es-ES', { weekday: 'short' })}</span>
                                                            <span className="block text-xl font-bold">{d.getDate()}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        <div className="mb-8">
                                            <p className="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Horarios Disponibles</p>
                                            <div className="grid grid-cols-3 gap-3">
                                                {TIME_SLOTS.map((time, i) => (
                                                    <button 
                                                        key={i}
                                                        onClick={() => setSelectedTime(time)}
                                                        className={`p-3 rounded-lg border text-sm font-medium transition-all ${selectedTime === time ? 'border-primary bg-primary text-white shadow-md' : 'border-gray-200 text-gray-700 hover:border-primary hover:text-primary'}`}
                                                    >
                                                        {time}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex justify-between">
                                            <button onClick={() => setStep(1)} className="text-gray-500 hover:text-dark font-medium px-4 py-3">
                                                <i className="fa-solid fa-arrow-left mr-2"></i> Volver
                                            </button>
                                            <button 
                                                disabled={!selectedDate || !selectedTime}
                                                onClick={() => setStep(3)}
                                                className="bg-dark disabled:bg-gray-300 disabled:cursor-not-allowed text-white px-8 py-3 rounded-xl font-bold transition-all hover:bg-gray-800"
                                            >
                                                Continuar <i className="fa-solid fa-arrow-right ml-2"></i>
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Paso 3 */}
                                {step === 3 && (
                                    <div className="animate-fade-in-up">
                                        <h3 className="text-xl font-bold mb-6 text-dark">Confirma tus datos</h3>
                                        
                                        <div className="bg-gray-50 p-6 rounded-xl mb-6 border border-gray-100">
                                            <div className="flex items-center gap-4 mb-4 pb-4 border-b border-gray-200">
                                                <div className="bg-primary/10 p-3 rounded-lg text-primary">
                                                    <i className={`fa-solid ${SERVICES.find(s=>s.id === selectedService)?.icon} text-xl`}></i>
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500">Servicio seleccionado</p>
                                                    <p className="font-bold text-dark">{SERVICES.find(s=>s.id === selectedService)?.name}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="bg-primary/10 p-3 rounded-lg text-primary">
                                                    <i className="fa-regular fa-clock text-xl"></i>
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-500">Fecha y Hora</p>
                                                    <p className="font-bold text-dark">{selectedDate} a las {selectedTime}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <form onSubmit={handleWhatsAppRedirect} className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Tu Nombre (Para la prueba)</label>
                                                <input 
                                                    type="text" 
                                                    required
                                                    value={customerName}
                                                    onChange={(e) => setCustomerName(e.target.value)}
                                                    placeholder="Ej. Juan Pérez"
                                                    className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                                                />
                                            </div>
                                            
                                            <div className="flex justify-between pt-6 border-t border-gray-100">
                                                <button type="button" onClick={() => setStep(2)} className="text-gray-500 hover:text-dark font-medium px-4 py-3">
                                                    <i className="fa-solid fa-arrow-left mr-2"></i> Volver
                                                </button>
                                                <button 
                                                    type="submit"
                                                    className="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg shadow-green-500/30 flex items-center gap-2"
                                                >
                                                    <i className="fa-brands fa-whatsapp text-xl"></i> Confirmar vía WhatsApp
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const FooterBanner = () => {
            const defaultMessage = "Hola, vi su página de demostración y quisiera más información sobre las soluciones digitales y páginas web que ofrecen para mi negocio.";
            const whatsappUrl = `https://wa.me/527777926013?text=${encodeURIComponent(defaultMessage)}`;

            return (
                <section id="contacto-final" className="py-20 relative overflow-hidden bg-dark">
                    <div className="absolute inset-0 opacity-10">
                        <div className="absolute -top-24 -right-24 w-96 h-96 bg-primary rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-pulse-slow"></div>
                        <div className="absolute -bottom-24 -left-24 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-pulse-slow" style={{animationDelay: '1s'}}></div>
                    </div>
                    
                    <div className="relative max-w-4xl mx-auto px-4 sm:px-6 text-center z-10">
                        <div className="inline-block bg-white/10 border border-white/20 text-white px-4 py-1.5 rounded-full text-sm font-bold tracking-wide mb-6 backdrop-blur-sm">
                            💡 DISEÑAMOS EL FUTURO DE TU EMPRESA
                        </div>
                        <h2 className="text-4xl md:text-5xl font-extrabold text-white mb-6 leading-tight">
                            ¿Te gustó esta experiencia interactiva?
                        </h2>
                        <p className="text-xl text-gray-300 mb-10 max-w-2xl mx-auto">
                            Imagina tener un sistema igual o mejor, <strong className="text-white">creado exclusivamente para tu negocio</strong>. Desde páginas web corporativas, tiendas en línea, hasta aplicaciones móviles de control interno o reservas.
                        </p>
                        
                        <div className="flex flex-col sm:flex-row justify-center items-center gap-6">
                            <a 
                                href={whatsappUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="bg-white text-dark px-8 py-4 rounded-full font-bold text-lg hover:bg-gray-100 transition-all shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:scale-105 flex items-center gap-3"
                            >
                                <i className="fa-brands fa-whatsapp text-green-500 text-2xl"></i>
                                Solicitar Asesoría Gratuita
                            </a>
                        </div>
                        
                        <p className="mt-8 text-sm text-gray-400">
                            Diseño a medida • Soporte técnico • Integraciones con WhatsApp • Cero complicaciones
                        </p>
                    </div>
                </section>
            );
        };

        const App = () => {
            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar />
                    <main className="flex-grow">
                        <Hero />
                        <IndustryGrid />
                        <BookingDemo />
                        <FooterBanner />
                    </main>
                    <footer className="bg-gray-900 py-8 text-center text-gray-500 text-sm border-t border-gray-800">
                        <p>© 2024 Soluciones Digitales. Demo interactiva para presentación.</p>
                    </footer>
                    
                    {/* Botón Flotante de WhatsApp global */}
                    <a 
                        href={`https://wa.me/527777926013?text=${encodeURIComponent("Hola, estoy viendo el demo de su página web y quiero hacerles una consulta general sobre sus servicios.")}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:bg-green-600 transition-transform transform hover:scale-110 z-50 group"
                    >
                        <i className="fa-brands fa-whatsapp text-3xl"></i>
                        <span className="absolute right-16 bg-black text-white text-xs px-3 py-1.5 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                            ¡Escríbenos!
                        </span>
                    </a>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
